# Render 免费部署配置
# 文档：https://render.com/docs/blueprint-spec
# 使用方式：Render 控制台 → New → Blueprint → 选择本仓库即可一键创建
services:
  - type: web
    name: gram-collectibles
    runtime: ruby
    plan: free
    buildCommand: bundle install
    startCommand: ruby server.rb
    healthCheckPath: /api/health
    envVars:
      - key: BIND_ADDRESS
        value: 0.0.0.0
      - key: RACK_ENV
        value: production
    # 以下变量请在 Render 控制台手工填写（不要写进仓库）
    # - key: DATABASE_URL
    #   fromDatabase:
    #     name: gram-postgres
    #     property: connectionString
    # - key: GRAM_ADMIN_USERNAME
    #   value: admin
    # - key: GRAM_ADMIN_PASSWORD
    #   generateValue: true

databases:
  - name: gram-postgres
    plan: free
    databaseName: gram
    user: gram
